[package]
name = "bitshit-onnx"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "bitshit_onnx"
crate-type = ["cdylib", "rlib"]

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["copy-dylibs", "download-binaries"] }
anyhow = "1.0"
tracing = "0.1"
cluaiz-shared = { package = "bitshit-shared", path = "../../Inference-engine/engines/cluaiz-shared" }
neural-core = { path = "../neural_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
image = "0.24"
ndarray = "0.15"
tokio = { version = "1.0", features = ["rt"] }

[features]
default = ["cpu"]
cpu = []
cuda = ["ort/cuda"]
