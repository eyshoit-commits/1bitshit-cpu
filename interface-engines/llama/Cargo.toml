[package]
name = "bitshit-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "bitshit_llama"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
anyhow = "1.0"
tracing = "0.1"
cluaiz-shared = { package = "bitshit-shared", path = "../../Inference-engine/engines/cluaiz-shared" }
tokenizers = "0.22.2"
libloading = "0.8"
tokio = { version = "1.37", features = ["full"] }
neural-core = { path = "../neural_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[build-dependencies]
cc = "1.0"
bindgen = "0.69"
cmake = "0.1"

[features]
default = []
cuda = []
metal = []
vulkan = []
rocm = []
openvino = []
qnn = []
sycl = []
cann = []
arm_neon = []
